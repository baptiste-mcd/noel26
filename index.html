<title>Mes suggestions pour Noël</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* Village de Noël de nuit en 3D, chaque souhait est un cadeau géant posé dans le village avec sa bulle. Look sombre unique, assumé. */
  :root {
    color-scheme: dark;
    --bg: #0b1226; --bg-2: #16213d; --card: #131d36; --text: #eef3ff; --muted: #9fb0cf; --line: #26345a;
    --paper: #fbf3e2; --ink: #24170b; --gold: #ffd166; --red: #e63946;
    --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: var(--f-body); margin: 0; }
  .page { max-width: 1280px; margin-inline: auto; padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
  h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.8rem, 4.4vw, 2.8rem); margin: 0; letter-spacing: .01em; text-wrap: balance; }
  .sub { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }

  .stage { position: relative; border-radius: 18px; overflow: hidden; background: radial-gradient(1.5px 1.5px at 12% 14%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 27% 8%, #fffc 50%, transparent 52%), radial-gradient(1.5px 1.5px at 44% 20%, #fffd 50%, transparent 52%), radial-gradient(1px 1px at 61% 6%, #fffb 50%, transparent 52%), radial-gradient(2px 2px at 78% 16%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 90% 9%, #fffc 50%, transparent 52%), radial-gradient(1.5px 1.5px at 6% 30%, #fffb 50%, transparent 52%), radial-gradient(1px 1px at 95% 34%, #fffb 50%, transparent 52%), radial-gradient(120% 95% at 50% 30%, #24365f, #0b1226 75%); box-shadow: inset 0 0 0 1px #0b1226; touch-action: pan-y; }
  .stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .stage canvas.dragging { cursor: grabbing; }
  .stage canvas.over { cursor: pointer; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #c9d6ee; background: #0b122699; padding: 4px 10px; border-radius: 999px; pointer-events: none; }
  .h-touch { display: none; }
  @media (hover: none), (pointer: coarse) { .h-desk { display: none; } .h-touch { display: inline; } }
  .fallback { padding: 40px 20px; text-align: center; color: var(--muted); }

  .bubble { position: absolute; left: 0; top: 0; pointer-events: none; padding-bottom: 14px; z-index: 1; }
  .bubble.open { z-index: 10; }
  .bubble-dot { position: absolute; left: 50%; bottom: -6px; width: 34px; height: 34px; margin-left: -17px; box-sizing: border-box; border-radius: 50%; background: var(--red); border: 3px solid #fff; box-shadow: 0 0 14px var(--red), 0 3px 0 #0005; display: grid; place-items: center; transition: opacity .2s, transform .2s; }
  .bubble-dot svg { width: 17px; height: 17px; display: block; pointer-events: none; }
  .bubble-dot { pointer-events: auto; cursor: pointer; }
  .bubble.open .bubble-dot { pointer-events: none; }
  .bubble.open .bubble-dot { opacity: 0; transform: scale(.4); }
  .bubble-in { transform-origin: 50% calc(100% + 12px); transform: scale(.15); opacity: 0; pointer-events: none; transition: transform .38s cubic-bezier(.34, 1.7, .6, 1), opacity .18s ease; }
  .bubble.open .bubble-in { transform: scale(1); opacity: 1; pointer-events: auto; }
  .bubble-in { --glass: rgba(14, 22, 46, .58); position: relative; display: flex; align-items: center; gap: 10px; background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(150%); backdrop-filter: blur(14px) saturate(150%); color: var(--text); border: 1px solid rgba(255, 255, 255, .2); border-radius: 16px; padding: 8px 12px 8px 8px; box-shadow: 0 12px 30px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .14); max-width: 240px; }
  .bubble-in::after { content: ""; position: absolute; left: 50%; top: 100%; width: 18px; height: 9px; margin-left: -9px; margin-top: 1px; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .bubble img { flex: none; width: 46px; height: 92px; object-fit: contain; background: #fff; border-radius: 10px; padding: 4px; box-sizing: border-box; }
  .bubble img.wide, .wish img.wide { width: 70px; height: 50px; }
  .bubble img.wide { padding: 3px; }
  .wish img.wide { width: 90px; height: 58px; padding: 0; background: none; }
  .bubble .who { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .bubble .nm { font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1.2; color: #fff; text-wrap: balance; }
  .bubble .pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-family: var(--f-display); font-weight: 600; font-size: 13px; color: #fff; background: var(--red); padding: 6px 12px; border-radius: 999px; text-decoration: none; box-shadow: 0 4px 12px rgba(230, 57, 70, .35); }
  .bubble a.pill:hover { filter: brightness(1.08); }
  .bubble a:focus-visible, .wish a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .bubble-in { --glass: rgba(14, 22, 46, .9); } }
  @media (max-width: 640px) {
    .bubble-in { gap: 6px; padding: 5px 8px 5px 5px; border-radius: 12px; max-width: 150px; }
    .bubble img { width: 24px; height: 46px; border-radius: 6px; padding: 2px; }
    .bubble img.wide { width: 36px; height: 26px; }
    .bubble .who { font-size: 9px; letter-spacing: .06em; }
    .bubble .nm { font-size: 11.5px; line-height: 1.15; }
    .bubble .pill { font-size: 10.5px; padding: 4px 8px; margin-top: 4px; }
    .bubble-dot { width: 30px; height: 30px; margin-left: -15px; }
    .bubble-dot svg { width: 15px; height: 15px; }
    .hint { font-size: 11px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .bubble-float { animation: float 2.4s ease-in-out infinite; }
    .bubble:not(.open) .bubble-dot { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    @keyframes float { 50% { transform: translateY(-6px); } }
  }

  .wishes { display: grid; gap: 10px; }
  .wishes h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; color: var(--muted); }
  .wish-grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .wish { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 0 #050a18; padding: 14px 16px; min-width: 0; transition: box-shadow .2s, border-color .2s; }
  .wish.flash { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold); }
  .wish img { flex: none; width: 54px; height: 120px; object-fit: contain; background: #fff; border-radius: 10px; padding: 6px; }
  .wish .who { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .wish h3 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; text-wrap: balance; }
  .wish p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .wish .pill { display: inline-flex; white-space: nowrap; margin-top: 10px; font-family: var(--f-display); font-weight: 600; font-size: 14px; color: #fff; background: var(--red); padding: 6px 14px; border-radius: 999px; text-decoration: none; }
  .note { margin: 0; font-size: 13px; color: var(--muted); }
</style>

<div class="page">
  <header>
    <h1>Mes suggestions pour Noël</h1>
    <p class="sub">Fais glisser pour faire le tour du village. Chaque cadeau géant est une idée : survole ou touche son icône rouge pour ouvrir sa bulle.</p>
  </header>

  <div class="stage" id="stage">
    <div class="labels" id="labels"></div>
    <span class="hint"><span class="h-desk">Glisser pour tourner</span><span class="h-touch">Glisser pour tourner · pincer pour zoomer</span></span>
  </div>

  <section class="wishes" aria-labelledby="wishes-title">
    <h2 id="wishes-title">Mes suggestions</h2>
    <ul class="wish-grid" id="wish-grid"></ul>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const WISHES = [
  {marque: "Aesop", nom: "Tacit", detail: "Eau de Parfum", cta: "Participation", img: "img/aesop-tacit.png", url: "https://www.aesop.fr/parfum/tacit-truths-eau-de-parfum/FR41.html"},
  {marque: "Maison", nom: "Purificateur d'air", detail: "Ex : Bosch Air 4000", img: "img/purificateur-air.png", cta: "Participation", url: "https://www.amazon.fr/Bosch-Air-4000-Purificateur-dAir/dp/B0B5D7H7VP?th=1"},
  {marque: "KNAON", nom: "Imprimante thermique", detail: "Blanche", img: "img/imprimante-knaon.png", wide: true, url: "https://www.amazon.fr/dp/B0DR86V4ZV?th=1"},
  {marque: "Vêtements", nom: "Carte cadeau", detail: "Pour des vêtements", cta: "Uniqlo, etc.", img: "img/carte-vetements.png", wide: true}
];
const touchUI = () => window.matchMedia("(hover: none), (pointer: coarse)").matches;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let selRing = null;

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const link = (w, text) => { if (!w.url) return el("span", "pill", text); const a = el("a", "pill", text); a.href = w.url; a.target = "_blank"; a.rel = "noopener"; return a; };
function bubble(w, i) {
  const b = el("div", "bubble"); b.dataset.i = i;
  const inner = el("div", "bubble-in");
  const im = el("img"); im.src = w.img; im.alt = ""; if (w.wide) im.className = "wide";
  const txt = el("div");
  txt.append(el("div", "who", w.marque), el("div", "nm", w.detail ? w.nom + " · " + w.detail : w.nom), link(w, w.cta || "Voir le produit ↗"));
  inner.append(im, txt);
  const fl = el("div", "bubble-float"); fl.append(inner);
  const dot = el("span", "bubble-dot"); dot.setAttribute("aria-hidden", "true");
  dot.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8"/><path d="M12 8v12"/><path d="M12 8c-1.5-3-5-3.5-5-1.2C7 8 9.5 8 12 8zM12 8c1.5-3 5-3.5 5-1.2C17 8 14.5 8 12 8z"/></svg>';
  b.append(fl, dot);
  return b;
}
const grid = document.getElementById("wish-grid");
const cards = WISHES.map((w) => {
  const li = el("li", "wish");
  const im = el("img"); im.src = w.img; im.alt = w.marque + " " + w.nom; if (w.wide) im.className = "wide";
  const txt = el("div");
  txt.append(el("div", "who", w.marque), el("h3", null, w.nom)); if (w.detail) txt.append(el("p", null, w.detail)); txt.append(link(w, w.cta || "Voir le produit ↗"));
  li.append(im, txt); grid.append(li);
  return li;
});
function focusWish(i) {
  const c = cards[i]; if (!c) return;
  c.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "nearest"});
  c.classList.add("flash"); setTimeout(() => c.classList.remove("flash"), 1400);
}

/* ---------- Scène 3D : le village ---------- */
const stage = document.getElementById("stage");
const labelsEl = document.getElementById("labels");
let ok = !!window.THREE;
let renderer;
if (ok) { try { renderer = new THREE.WebGLRenderer({antialias: true, alpha: true}); } catch (e) { ok = false; } }

if (!ok) {
  stage.style.minHeight = "120px";
  const f = document.createElement("p"); f.className = "fallback"; f.textContent = "La 3D ne peut pas s'afficher sur cet appareil. Les suggestions restent visibles ci-dessous.";
  stage.replaceChildren(f);
} else {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0e1730, 85, 170);
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  /* lumière d'hiver */
  scene.add(new THREE.HemisphereLight(0x5a70a8, 0x1a1410, 0.5));
  scene.add(new THREE.AmbientLight(0x2a3a66, 0.25));
  const sun = new THREE.DirectionalLight(0xa9c0ff, 0.6);
  sun.position.set(-22, 34, 18); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, {left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 110});
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  const mats = {};
  const M = (hex, o = {}) => (mats[hex + JSON.stringify(o)] ||= new THREE.MeshStandardMaterial(Object.assign({color: hex, roughness: 0.85, flatShading: true}, o)));
  const G = (hex, i = 1.4) => new THREE.MeshStandardMaterial({color: hex, emissive: hex, emissiveIntensity: i, roughness: 0.4});
  const add = (p, geo, mat, x = 0, y = 0, z = 0, o = {}) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
    if (o.rx) m.rotation.x = o.rx; if (o.ry) m.rotation.y = o.ry; if (o.rz) m.rotation.z = o.rz; if (o.s) m.scale.setScalar(o.s);
    m.castShadow = o.cast !== false; m.receiveShadow = true; p.add(m); return m;
  };
  const BOX = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const CYL = (rt, rb, h, s = 12) => new THREE.CylinderGeometry(rt, rb, h, s);
  const SPH = (r, s = 10) => new THREE.SphereGeometry(r, s, Math.max(6, s - 2));
  const SNOW = M(0xf6f9ff, {roughness: 1}), WOOD = M(0xa8703f), WOOD_D = M(0x6b3f22), WOOD_DD = M(0x4a2a14);
  const RED = M(0xd62839), GOLD = G(0xffd166, 1.5), WIN = G(0xffb44d, 1.6), GREEN = M(0x2f7d4f), STONE = M(0xb9aa96);
  const bulbs = [], smokes = [], spinners = [], bobbers = [];

  /* île enneigée aux bords irréguliers */
  const RAD = 22;
  const BOTTLE = {x: -14, z: 8, s: 1.45};
  const PURI = {x: 14.8, z: -7.2, s: 1.45};
  const CARD = {x: -1, z: 7.8};
  const PRINTER = {x: -7, z: -12, s: 1.5};
  const shape = new THREE.Shape();
  for (let i = 0; i <= 48; i++) {
    const a = (i / 48) * Math.PI * 2, r = RAD + Math.sin(a * 3) * 1.4 + Math.cos(a * 5) * 0.9;
    const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? shape.lineTo(x, y) : shape.moveTo(x, y);
  }
  const ext = (depth, bevel) => { const g = new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2}); g.rotateX(-Math.PI / 2); return g; };
  add(scene, ext(2.2, 0.3), M(0x7a5536), 0, -2.9, 0, {cast: false});
  add(scene, ext(0.6, 0.5), SNOW, 0, -0.65, 0, {cast: false});
  const plaza = add(scene, new THREE.CircleGeometry(6.2, 40), STONE, 0, 0.02, 0, {rx: -Math.PI / 2, cast: false});
  add(scene, new THREE.RingGeometry(6.2, 6.7, 40), M(0x9e8a73), 0, 0.03, 0, {rx: -Math.PI / 2, cast: false});

  /* briques de décor */
  const pine = (x, z, s = 1, parent = scene) => {
    const g = new THREE.Group(); g.position.set(x, 0, z); parent.add(g);
    add(g, CYL(0.15 * s, 0.22 * s, 0.7 * s, 6), WOOD_DD, 0, 0.35 * s, 0);
    [[1.3, 1.4, 1.0], [1.05, 1.2, 1.8], [0.72, 1.05, 2.55]].forEach(([r, h, y]) => {
      add(g, new THREE.ConeGeometry(r * s, h * s, 7), GREEN, 0, y * s, 0);
      add(g, new THREE.ConeGeometry(r * 0.45 * s, h * 0.4 * s, 7), SNOW, 0, (y + h * 0.32) * s, 0);
    });
    return g;
  };
  const gift = (p, x, z, s, c, ry = 0) => {
    const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; p.add(g);
    add(g, BOX(s, s, s), M(c), 0, s / 2, 0);
    add(g, BOX(s * 1.03, s * 1.03, s * 0.18), M(0xffd166), 0, s / 2, 0);
    add(g, BOX(s * 0.18, s * 1.03, s * 1.03), M(0xffd166), 0, s / 2, 0);
    return g;
  };
  const lamp = (x, z, light) => {
    const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
    add(g, CYL(0.09, 0.13, 3.2, 8), M(0x2a2e37, {roughness: 0.5, metalness: 0.4}), 0, 1.6, 0);
    add(g, BOX(0.42, 0.5, 0.42), G(0xffd166, 1.6), 0, 3.4, 0, {cast: false});
    add(g, new THREE.ConeGeometry(0.4, 0.35, 4), M(0x2a2e37), 0, 3.82, 0, {ry: Math.PI / 4});
    add(g, new THREE.TorusGeometry(0.22, 0.06, 6, 12), RED, 0, 2.7, 0.12);
    { const pl = new THREE.PointLight(0xffa64d, 1.4, 9, 2); pl.position.set(0, 3.3, 0); g.add(pl); }
  };
  const snowman = (x, z, ry = 0) => {
    const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
    add(g, SPH(0.75, 12), SNOW, 0, 0.7, 0); add(g, SPH(0.55, 12), SNOW, 0, 1.75, 0); add(g, SPH(0.4, 12), SNOW, 0, 2.55, 0);
    add(g, new THREE.ConeGeometry(0.08, 0.45, 6), M(0xf28c28), 0, 2.55, 0.5, {rx: Math.PI / 2});
    add(g, CYL(0.3, 0.3, 0.45, 12), M(0x222222), 0, 3.05, 0); add(g, CYL(0.45, 0.45, 0.05, 12), M(0x222222), 0, 2.85, 0);
    add(g, new THREE.TorusGeometry(0.42, 0.1, 6, 14), RED, 0, 2.2, 0, {rx: Math.PI / 2});
  };
  const candyCane = (x, z, ry = 0) => {
    const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
    for (let i = 0; i < 6; i++) add(g, CYL(0.1, 0.1, 0.32, 8), i % 2 ? SNOW : RED, 0, 0.16 + i * 0.32, 0);
    add(g, new THREE.TorusGeometry(0.28, 0.1, 6, 12, Math.PI), RED, 0.28, 1.92, 0);
  };
  const stringLights = (p, pts) => {
    const cols = [0xff5d5d, 0xffd166, 0x6ee7a8, 0x7cc4ff];
    pts.forEach((pt, i) => bulbs.push(add(p, SPH(0.08, 8), G(cols[i % 4], 1.8), pt[0], pt[1], pt[2], {cast: false})));
  };
  const smoke = (p, x, y, z) => { for (let i = 0; i < 4; i++) { const s = add(p, SPH(0.28, 8), M(0xe8edf4, {transparent: true, opacity: 0.8}), x, y, z, {cast: false}); smokes.push({m: s, x, y, z, t: i / 4}); } };
  const flag = (p, x, y, z, color) => {
    add(p, CYL(0.04, 0.04, 1.4, 6), M(0x3a3a3a), x, y + 0.7, z);
    add(p, BOX(0.7, 0.42, 0.04), M(color), x + 0.36, y + 1.18, z);
  };

  /* ---------- les bâtiments du village ---------- */
  const B = {
    maison(g, c) { /* maison du Père Noël */
      add(g, BOX(4.2, 2.8, 3.4), M(0x8b4a2b), 0, 1.4, 0);
      for (let i = 0; i < 6; i++) add(g, BOX(4.25, 0.08, 3.45), WOOD_DD, 0, 0.4 + i * 0.45, 0, {cast: false});
      const roof = new THREE.Group(); roof.position.y = 2.8; g.add(roof);
      add(roof, BOX(4.8, 0.25, 2.3), M(c), 0, 0.85, 0.85, {rx: 0.75}); add(roof, BOX(4.8, 0.25, 2.3), M(c), 0, 0.85, -0.85, {rx: -0.75});
      add(roof, BOX(4.9, 0.18, 1.2), SNOW, 0, 1.25, 0.45, {rx: 0.75}); add(roof, BOX(4.9, 0.18, 1.2), SNOW, 0, 1.25, -0.45, {rx: -0.75});
      add(g, BOX(0.7, 1.9, 0.7), M(0x9c3d2b), 1.3, 4.4, -0.5); add(g, BOX(0.85, 0.2, 0.85), SNOW, 1.3, 5.4, -0.5); smoke(g, 1.3, 5.7, -0.5);

  const PW = M(0xf3f4f6, {roughness: 0.4, emissive: 0x2a2f3c, emissiveIntensity: 0.5}), PG = M(0xd9dce2, {roughness: 0.5, emissive: 0x1e222c, emissiveIntensity: 0.4});

  const ltex = (() => {
    const c = document.createElement("canvas"); c.width = 256; c.height = 384; const x = c.getContext("2d");

  add(scene, new THREE.RingGeometry(3.3, 3.75, 48), selRing.material, PRINTER.x, 0.06, PRINTER.z, {rx: -Math.PI / 2, cast: false});

  /* neige qui tombe */

  for (let k = 0; k < NS; k++) { sp[k * 3] = (rnd() - 0.5) * 56; sp[k * 3 + 1] = rnd() * 26; sp[k * 3 + 2] = (rnd() - 0.5) * 56; vel[k] = 0.6 + rnd() * 0.9; }
  const sgeo = new THREE.BufferGeometry(); sgeo.setAttribute("position", new THREE.BufferAttribute(sp, 3));

  const anchors = [{obj: bottle, y: 7.5 * BOTTLE.s}, {obj: puri, y: 6.7 * PURI.s}, {obj: printer, y: 3.3 * PRINTER.s}, {obj: card, y: 3.4}];
  const gifts3d = [bottle, puri, printer, card];
  WISHES.forEach((w, i) => labelsEl.append(bubble(w, i)));

  const refresh = () => bubbleEls.forEach((b, i) => b.classList.toggle("open", hoverI >= 0 ? i === hoverI : i === autoI));
  const setHover = (i, hold = 280) => { clearTimeout(clearT); if (i >= 0) { hoverI = i; refresh(); } else clearT = setTimeout(() => { hoverI = -1; refresh(); }, hold); };

  setTimeout(step, 700); setInterval(step, 3600);
  bubbleEls.forEach((b, i) => { const inn = b.querySelector(".bubble-in"); inn.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") setHover(i); }); inn.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") setHover(-1); });

  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);

  const placeCam = () => { cam.position.set(target.x + RC * Math.cos(el) * Math.sin(az), target.y + RC * Math.sin(el), target.z + RC * Math.cos(el) * Math.cos(az)); cam.lookAt(target); };
  let vw = 0, vh = 0;
  const resize = () => {

  let down = null, moved = false;
  const cv = renderer.domElement;
  const pts = new Map(); let pinch = null;

  const pinchState = () => { const [p1, p2] = [...pts.values()]; return {d: Math.hypot(p1.x - p2.x, p1.y - p2.y), mx: (p1.x + p2.x) / 2, my: (p1.y + p2.y) / 2}; };

    });

  };

}
